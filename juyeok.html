<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>주역점 | 점쟁이 회계사</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#03040a;color:#fff;font-family:'Noto Serif KR',serif;overflow:hidden;}

/* ── 별 배경 ── */
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* ── 화면 전환 오버레이 ── */
#transition-overlay{
  position:fixed;inset:0;z-index:999;pointer-events:none;
  background:radial-gradient(circle at 50% 50%, rgba(200,168,110,0.15), #03040a);
  opacity:0;
}

/* ── 공통 스크린 ── */
.screen{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;
  opacity:0;pointer-events:none;
  transition:opacity 0.45s ease;
  overflow-y:auto;
}
.screen.active{opacity:1;pointer-events:all;}

/* ── 상단 바 ── */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:14px 20px;display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(to bottom,rgba(3,4,10,0.95),transparent);
}
.logo{font-family:'Nanum Gothic',sans-serif;font-weight:800;font-size:12px;letter-spacing:2px;color:#c8a86e;text-decoration:none;}
.back-btn{font-family:'Nanum Gothic',sans-serif;font-size:11px;color:rgba(200,168,110,0.7);background:none;border:1px solid rgba(200,168,110,0.25);padding:4px 10px;border-radius:3px;cursor:pointer;transition:all 0.2s;text-decoration:none;}
.back-btn:hover{color:#c8a86e;border-color:rgba(200,168,110,0.6);}

/* ── SCREEN 1: 모드 선택 ── */
#s-mode .title{
  font-family:'Nanum Gothic',sans-serif;font-weight:800;
  font-size:clamp(28px,8vw,44px);color:#c8a86e;letter-spacing:6px;
  text-shadow:0 0 30px rgba(200,168,110,0.5);margin-bottom:8px;text-align:center;
}
#s-mode .subtitle{font-size:13px;color:rgba(255,255,255,0.45);letter-spacing:3px;margin-bottom:40px;text-align:center;}
.mode-cards{display:flex;flex-direction:column;gap:14px;width:100%;max-width:320px;}
.mode-card{
  background:rgba(255,255,255,0.03);border:1px solid rgba(200,168,110,0.2);
  border-radius:8px;padding:20px 24px;cursor:pointer;transition:all 0.3s;
  display:flex;align-items:center;gap:16px;
}
.mode-card:hover{background:rgba(200,168,110,0.09);border-color:rgba(200,168,110,0.6);transform:translateX(6px);}
.mode-card-icon{font-size:26px;flex-shrink:0;}
.mode-card-label{font-family:'Nanum Gothic',sans-serif;font-weight:800;font-size:16px;color:#fff;}
.mode-card-sub{font-size:10px;color:rgba(200,168,110,0.45);margin-top:3px;letter-spacing:1px;}

/* ── SCREEN 2: 동전 던지기 ── */
#s-coin{gap:0;justify-content:center;}
.mode-badge{font-family:'Nanum Gothic',sans-serif;font-weight:800;font-size:13px;color:#c8a86e;letter-spacing:2px;margin-bottom:16px;text-align:center;}
.coin-area{
  width:180px;height:180px;position:relative;cursor:pointer;margin-bottom:24px;
  display:flex;align-items:center;justify-content:center;
}
.coin-area:hover .coin-idle{filter:brightness(1.15);}
#coin-canvas{display:block;}
.throw-hint{font-size:13px;color:rgba(255,255,255,0.5);letter-spacing:2px;margin-bottom:28px;text-align:center;min-height:20px;}

/* 효선 쌓기 */
.yao-stack{display:flex;flex-direction:column-reverse;align-items:center;gap:8px;margin-bottom:20px;min-height:160px;}
.yao-row{display:flex;align-items:center;gap:4px;opacity:0;transform:translateY(10px);transition:opacity 0.4s,transform 0.4s;}
.yao-row.show{opacity:1;transform:translateY(0);}
.yao-num{font-size:10px;color:rgba(200,168,110,0.4);width:14px;text-align:right;font-family:'Nanum Gothic',sans-serif;}
.yao-yang{width:80px;height:10px;background:linear-gradient(90deg,#c8a86e,#f0d090,#c8a86e);border-radius:2px;box-shadow:0 0 8px rgba(200,168,110,0.4);}
.yao-yin-wrap{display:flex;gap:8px;}
.yao-yin-half{width:35px;height:10px;background:linear-gradient(90deg,#c8a86e,#f0d090,#c8a86e);border-radius:2px;box-shadow:0 0 8px rgba(200,168,110,0.4);}
.coin-guide{
  font-family:'Noto Serif KR',serif;font-weight:600;
  font-size:clamp(15px,4vw,20px);color:#ffffff;
  text-align:center;letter-spacing:1px;line-height:1.8;
  margin-bottom:18px;padding:0 12px;
  text-shadow:0 2px 12px rgba(0,0,0,0.6);
}
.throw-count{font-size:11px;color:rgba(200,168,110,0.5);letter-spacing:2px;text-align:center;}

/* ── 괘 완성 중간 화면 ── */
#s-gua{text-align:center;}
.gua-name-big{font-family:'Nanum Gothic',sans-serif;font-weight:800;font-size:clamp(22px,6vw,34px);color:#c8a86e;margin-bottom:8px;text-shadow:0 0 20px rgba(200,168,110,0.5);}
.gua-num{font-size:11px;color:rgba(200,168,110,0.4);letter-spacing:3px;margin-bottom:28px;}
.gua-symbol-big{display:flex;flex-direction:column-reverse;align-items:center;gap:10px;margin-bottom:32px;}
.gua-yang-big{width:90px;height:12px;background:linear-gradient(90deg,#c8a86e,#f0d090,#c8a86e);border-radius:2px;box-shadow:0 0 10px rgba(200,168,110,0.5);}
.gua-yin-big{display:flex;gap:10px;}
.gua-yin-half-big{width:38px;height:12px;background:linear-gradient(90deg,#c8a86e,#f0d090,#c8a86e);border-radius:2px;box-shadow:0 0 10px rgba(200,168,110,0.5);}
.gua-reveal-btn{
  font-family:'Nanum Gothic',sans-serif;font-weight:800;font-size:14px;
  background:rgba(200,168,110,0.1);border:1px solid rgba(200,168,110,0.4);
  color:#c8a86e;padding:14px 36px;border-radius:4px;cursor:pointer;
  transition:all 0.25s;letter-spacing:2px;
}
.gua-reveal-btn:hover{background:rgba(200,168,110,0.2);border-color:#c8a86e;}

/* ── SCREEN 4: 해석 ── */
#s-result{padding-top:80px;padding-bottom:40px;justify-content:flex-start;}
.result-inner{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:20px;}
.result-gua-symbol{display:flex;flex-direction:column-reverse;align-items:center;gap:8px;margin-bottom:4px;}
.result-yang{width:72px;height:9px;background:linear-gradient(90deg,#c8a86e,#f0d090,#c8a86e);border-radius:2px;}
.result-yin{display:flex;gap:7px;}
.result-yin-half{width:30px;height:9px;background:linear-gradient(90deg,#c8a86e,#f0d090,#c8a86e);border-radius:2px;}
.result-gua-name{font-family:'Nanum Gothic',sans-serif;font-weight:800;font-size:22px;color:#c8a86e;letter-spacing:2px;}
.result-gua-num{font-size:10px;color:rgba(200,168,110,0.4);letter-spacing:3px;margin-top:2px;}
.result-divider{width:100%;height:1px;background:linear-gradient(to right,transparent,rgba(200,168,110,0.35),transparent);}
.result-card{
  width:100%;background:rgba(255,255,255,0.03);
  border:1px solid rgba(200,168,110,0.15);border-radius:8px;padding:22px 20px;
}
.result-card-label{font-family:'Nanum Gothic',sans-serif;font-size:9px;letter-spacing:3px;color:rgba(200,168,110,0.5);margin-bottom:12px;text-transform:uppercase;}
.result-oneline{font-family:'Noto Serif KR',serif;font-size:15px;color:rgba(255,255,255,0.75);line-height:1.8;margin-bottom:16px;}
.result-main{font-family:'Noto Serif KR',serif;font-weight:700;font-size:17px;color:#ffffff;line-height:1.9;word-break:keep-all;white-space:pre-line;}
.result-stock-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.result-stock-tag{
  font-family:'Nanum Gothic',sans-serif;font-weight:800;font-size:13px;
  background:rgba(200,168,110,0.12);border:1px solid rgba(200,168,110,0.35);
  color:#f0d090;padding:5px 12px;border-radius:4px;
}
.again-btn{
  font-family:'Noto Serif KR',serif;font-weight:700;font-size:13px;
  background:none;border:1px solid rgba(200,168,110,0.35);
  color:rgba(200,168,110,0.8);padding:12px 32px;border-radius:4px;
  cursor:pointer;transition:all 0.2s;letter-spacing:2px;margin-top:8px;
}
.again-btn:hover{border-color:#c8a86e;background:rgba(200,168,110,0.08);}
.home-btn{
  font-family:'Noto Serif KR',serif;font-weight:400;font-size:12px;
  color:rgba(255,255,255,0.35);letter-spacing:2px;text-decoration:none;
  margin-top:4px;padding:8px;transition:color 0.2s;
}
.home-btn:hover{color:rgba(255,255,255,0.7);}

/* ── 파티클 오버레이 ── */
#particle-canvas{position:fixed;inset:0;z-index:50;pointer-events:none;}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<canvas id="particle-canvas"></canvas>
<div id="transition-overlay"></div>

<div class="topbar">

      </div>

  </div>

<!-- S2: 동전 던지기 -->
<div class="screen" id="s-coin">

  <div class="throw-count" id="throw-count"></div>
</div>

<!-- S3: 괘 완성 -->
<div class="screen" id="s-gua">
  <div class="gua-num" id="gua-num-label"></div>
  <div class="gua-name-big" id="gua-name-label"></div>
  <div class="gua-symbol-big" id="gua-symbol-big"></div>
  <button class="gua-reveal-btn" onclick="showResult()">해석 보기 →</button>
</div>

<!-- S4: 해석 -->
<div class="screen" id="s-result">
  <div class="result-inner">
    <div class="result-gua-symbol" id="result-symbol"></div>
    <div class="result-gua-name" id="result-name"></div>
    <div class="result-gua-num" id="result-num"></div>
    <div class="result-divider"></div>
    <div class="result-card" id="result-card">
      <div class="result-card-label" id="result-label"></div>
      <div class="result-oneline" id="result-oneline"></div>
      <div class="result-main" id="result-main"></div>
      <div class="result-stock-wrap" id="result-stocks"></div>
    </div>
    <a class="home-btn" href="https://fortunecpa.co.kr/">← 홈으로 돌아가기</a>
  </div>
</div>

/* ── 상태 ── */
let currentMode = 'advice';
let throwCount = 0;
let results = []; // 'yang' or 'yin' x6
let isAnimating = false;

/* ── 별 배경 ── */
(function(){
  const c=document.getElementById('bg-canvas');
  let stars=[];
  function resize(){ c.width=window.innerWidth; c.height=window.innerHeight; initStars(); }
  function initStars(){
    stars=[];
    for(let i=0;i<220;i++) stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.2+0.2,a:Math.random()*0.7+0.1,tw:Math.random()*Math.PI*2,sp:Math.random()*0.015+0.003});
  }
  function draw(){
    const ctx=c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height);
    const t=Date.now()*0.001;
    // 은하수 띠
    ctx.save(); ctx.translate(c.width*.5,c.height*.5); ctx.rotate(-0.3);
    const mw=ctx.createLinearGradient(-c.width,0,c.width,0);
    mw.addColorStop(0,'rgba(30,20,60,0)'); mw.addColorStop(.45,'rgba(60,40,120,.1)'); mw.addColorStop(.5,'rgba(80,60,160,.15)'); mw.addColorStop(.55,'rgba(60,40,120,.1)'); mw.addColorStop(1,'rgba(30,20,60,0)');
    ctx.fillStyle=mw; ctx.fillRect(-c.width,-c.height*.7,c.width*2,c.height*1.4); ctx.restore();
    stars.forEach(s=>{
      const a=s.a*(0.6+0.4*Math.sin(s.tw+t*s.sp*10));
      ctx.beginPath(); ctx.arc(s.x*c.width,s.y*c.height,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(220,200,160,${a})`; ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',resize); resize(); draw();
})();

/* ── 파티클 ── */
const pCvs=document.getElementById('particle-canvas');
const pCtx=pCvs.getContext('2d');
let particles=[];
function resizeParticle(){ pCvs.width=window.innerWidth; pCvs.height=window.innerHeight; }
window.addEventListener('resize',resizeParticle); resizeParticle();
function spawnParticles(x,y,color,n=20){
  for(let i=0;i<n;i++) particles.push({x,y,vx:(Math.random()-0.5)*6,vy:(Math.random()-2)*5,life:1,decay:0.02+Math.random()*0.03,size:2+Math.random()*4,color});
}
(function particleLoop(){
  pCtx.clearRect(0,0,pCvs.width,pCvs.height);
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life-=p.decay;
    pCtx.globalAlpha=p.life; pCtx.fillStyle=p.color;
    pCtx.beginPath(); pCtx.arc(p.x,p.y,p.size,0,Math.PI*2); pCtx.fill();
  });
  pCtx.globalAlpha=1;
  requestAnimationFrame(particleLoop);
})();

/* ── 화면 전환 ── */
function transitionTo(fromId, toId, onMid){
  const overlay=document.getElementById('transition-overlay');
  const from=document.getElementById(fromId);
  const to=document.getElementById(toId);

  // 1) 오버레이 올리기
  overlay.style.transition='opacity 0.3s ease';
  overlay.style.opacity='1';

  setTimeout(()=>{
    // 2) 모든 화면 비활성화 (인라인 스타일 완전 제거)
    document.querySelectorAll('.screen').forEach(s=>{
      s.classList.remove('active');
      s.removeAttribute('style'); // 인라인 스타일 전부 제거
    });

    if(onMid) onMid();

    // 3) 대상 화면 활성화
    to.classList.add('active');

    // 4) 오버레이 내리기
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      overlay.style.transition='opacity 0.4s ease';
      overlay.style.opacity='0';
    }));
  }, 320);
}

/* ── 동전 캔버스 ── */
const coinCvs=document.getElementById('coin-canvas');
const coinCtx=coinCvs.getContext('2d');
let coinAnim={active:false,phase:0,result:null,speed:0};

function drawCoin(scaleX, isFront, glowAmt){
  const W=coinCvs.width, H=coinCvs.height;
  coinCtx.clearRect(0,0,W,H);
  const cx=W/2, cy=H/2, r=62;
  const sx=Math.abs(scaleX);

  coinCtx.save();
  coinCtx.translate(cx,cy);
  coinCtx.scale(scaleX,1);

  // 동전 테두리 glow
  if(glowAmt>0){
    const grd=coinCtx.createRadialGradient(0,0,r*0.5,0,0,r*1.4);
    grd.addColorStop(0,`rgba(200,168,110,${glowAmt*0.4})`);
    grd.addColorStop(1,'transparent');
    coinCtx.beginPath(); coinCtx.arc(0,0,r*1.4,0,Math.PI*2);
    coinCtx.fillStyle=grd; coinCtx.fill();
  }

  // 동전 본체
  const grad=coinCtx.createRadialGradient(-r*0.25,-r*0.2,r*0.1,0,0,r);
  if(isFront){
    grad.addColorStop(0,'#e8e0cc'); grad.addColorStop(0.4,'#c8c0a8'); grad.addColorStop(0.8,'#a09080'); grad.addColorStop(1,'#786050');
  } else {
    grad.addColorStop(0,'#d8d0bc'); grad.addColorStop(0.4,'#b0a890'); grad.addColorStop(0.8,'#888070'); grad.addColorStop(1,'#605848');
  }
  coinCtx.beginPath(); coinCtx.arc(0,0,r,0,Math.PI*2);
  coinCtx.fillStyle=grad; coinCtx.fill();

  // 테두리 음각 링
  coinCtx.strokeStyle='rgba(0,0,0,0.3)'; coinCtx.lineWidth=3;
  coinCtx.beginPath(); coinCtx.arc(0,0,r-3,0,Math.PI*2); coinCtx.stroke();
  coinCtx.strokeStyle='rgba(255,255,255,0.15)'; coinCtx.lineWidth=1.5;
  coinCtx.beginPath(); coinCtx.arc(0,0,r-6,0,Math.PI*2); coinCtx.stroke();

  if(sx>0.15){
    if(isFront){
      // 앞면: 두루미 실루엣
      coinCtx.fillStyle='rgba(60,50,40,0.85)';
      // 몸통
      coinCtx.beginPath(); coinCtx.ellipse(0,8,14,20,0,0,Math.PI*2); coinCtx.fill();
      // 목
      coinCtx.beginPath(); coinCtx.moveTo(-4,-8); coinCtx.quadraticCurveTo(-8,-22,-2,-34); coinCtx.quadraticCurveTo(2,-36,4,-28); coinCtx.quadraticCurveTo(0,-18,4,-10); coinCtx.closePath(); coinCtx.fill();
      // 부리
      coinCtx.fillStyle='rgba(80,60,30,0.9)';
      coinCtx.beginPath(); coinCtx.moveTo(-2,-34); coinCtx.lineTo(-12,-30); coinCtx.lineTo(-2,-28); coinCtx.fill();
      // 날개
      coinCtx.fillStyle='rgba(50,42,34,0.7)';
      coinCtx.beginPath(); coinCtx.moveTo(-4,2); coinCtx.quadraticCurveTo(-32,-4,-34,12); coinCtx.quadraticCurveTo(-20,14,-4,16); coinCtx.fill();
      coinCtx.beginPath(); coinCtx.moveTo(4,2); coinCtx.quadraticCurveTo(28,-2,30,10); coinCtx.quadraticCurveTo(18,14,4,16); coinCtx.fill();
      // 다리
      coinCtx.strokeStyle='rgba(60,50,40,0.8)'; coinCtx.lineWidth=2.5;
      coinCtx.beginPath(); coinCtx.moveTo(-5,26); coinCtx.lineTo(-6,40); coinCtx.lineTo(-12,46); coinCtx.stroke();
      coinCtx.beginPath(); coinCtx.moveTo(4,26); coinCtx.lineTo(5,40); coinCtx.lineTo(11,46); coinCtx.stroke();
      // 머리 붉은 점
      coinCtx.fillStyle='rgba(180,30,20,0.9)';
      coinCtx.beginPath(); coinCtx.arc(0,-31,4,0,Math.PI*2); coinCtx.fill();
      // 텍스트
      coinCtx.fillStyle='rgba(60,50,40,0.6)';
      coinCtx.font=`bold ${Math.round(8*sx)}px sans-serif`;
      coinCtx.textAlign='center'; coinCtx.textBaseline='middle';
      coinCtx.fillText('한국은행',0,52*sx>8?52:52);
    } else {
      // 뒷면: 500
      coinCtx.fillStyle='rgba(60,50,40,0.9)';
      coinCtx.font=`bold ${Math.round(38*sx)}px 'Nanum Gothic',sans-serif`;
      coinCtx.textAlign='center'; coinCtx.textBaseline='middle';
      coinCtx.fillText('500',0,-4);
      coinCtx.font=`${Math.round(10*sx)}px sans-serif`;
      coinCtx.fillStyle='rgba(60,50,40,0.6)';
      coinCtx.fillText('원',0,22);
      // 무궁화 장식
      for(let i=0;i<8;i++){
        const a=i/8*Math.PI*2;
        coinCtx.beginPath();
        coinCtx.arc(Math.cos(a)*48*sx,Math.sin(a)*48*sx,3*sx,0,Math.PI*2);
        coinCtx.fillStyle='rgba(60,50,40,0.25)';
        coinCtx.fill();
      }
    }
  }
  coinCtx.restore();
}

/* ── 동전 애니메이션 ── */
let coinAnimId=null;
function animateCoin(finalResult, onDone){
  if(coinAnimId) cancelAnimationFrame(coinAnimId);
  let t=0;
  const totalFrames=38; // 더 짧게
  const frontSide = finalResult==='양';

  function step(){
    t++;
    const progress=t/totalFrames;
    // 앞부분 빠르게, 뒷부분 감속
    const speed = progress < 0.6 ? 28 : 28*(1-(progress-0.6)/0.4*0.92);
    const angle = (t * speed) * Math.PI / 180;
    let scaleX = Math.cos(angle);

    let isFront;
    if(t < totalFrames*0.82){
      isFront = Math.floor(t*speed/180) % 2 === 0;
    } else {
      isFront = frontSide;
      scaleX = Math.abs(scaleX);
    }
    const glow = progress > 0.75 ? (progress-0.75)/0.25 : 0;
    drawCoin(scaleX, isFront, glow);

    if(t < totalFrames){ coinAnimId=requestAnimationFrame(step); }
    else { drawCoin(1, frontSide, 1); if(onDone) onDone(); }
  }
  step();
}

/* ── 동전 소리 ── */
let audioCtx=null;
function getCoinSound(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  const ac=audioCtx;
  // 짧은 메탈릭 틱 사운드
  const osc=ac.createOscillator();
  const gain=ac.createGain();
  const filter=ac.createBiquadFilter();
  filter.type='bandpass'; filter.frequency.value=3000; filter.Q.value=2;
  osc.type='sine'; osc.frequency.setValueAtTime(1800,ac.currentTime);
  osc.frequency.exponentialRampToValueAtTime(400,ac.currentTime+0.15);
  gain.gain.setValueAtTime(0.4,ac.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.18);
  osc.connect(filter); filter.connect(gain); gain.connect(ac.destination);
  osc.start(); osc.stop(ac.currentTime+0.18);
}
function playLandingSound(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  const ac=audioCtx;
  const buf=ac.createBuffer(1,ac.sampleRate*0.08,ac.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2)*0.5;
  const src=ac.createBufferSource(); src.buffer=buf;
  const g=ac.createGain(); g.gain.value=0.3;
  src.connect(g); g.connect(ac.destination); src.start();
}

/* ── 효선(爻) 렌더링 ── */
function renderYao(container, type, index, animate){
  const row=document.createElement('div');
  row.className='yao-row';
  const num=document.createElement('div');
  num.className='yao-num';
  num.textContent=index+1;
  row.appendChild(num);
  if(type==='양'){
    const bar=document.createElement('div');
    bar.className='yao-yang';
    row.appendChild(bar);
  } else {
    const wrap=document.createElement('div');
    wrap.className='yao-yin-wrap';
    const h1=document.createElement('div'); h1.className='yao-yin-half';
    const h2=document.createElement('div'); h2.className='yao-yin-half';
    wrap.appendChild(h1); wrap.appendChild(h2);
    row.appendChild(wrap);
  }
  container.appendChild(row);
  if(animate){
    setTimeout(()=>row.classList.add('show'),50);
    const cx=coinCvs.getBoundingClientRect();
    spawnParticles(cx.left+cx.width/2, cx.top+cx.height/2, type==='양'?'#f0d090':'#88aaff', 18);
  } else {
    row.classList.add('show');
  }
}

/* ── 괘 찾기 ── */
function findHexagram(yaoArr){
  // yaoArr: ['양','음',...] 길이 6, 1효부터 6효
  for(const h of HEXAGRAMS){
    let match=true;
    for(let i=0;i<6;i++){ if(h.yao[i]!==yaoArr[i]){ match=false; break; } }
    if(match) return h;
  }
  // 못 찾으면 랜덤
  return HEXAGRAMS[Math.floor(Math.random()*64)];
}

/* ── 모드 선택 ── */
function selectMode(mode){
  currentMode=mode;
  throwCount=0; results=[];
  document.getElementById('mode-badge').textContent=mode==='advice'?'🔮 현 상황 조언 듣기':'📈 국내 주식 추천 받기';
  document.getElementById('yao-stack').innerHTML='';
  document.getElementById('throw-hint').textContent='동전을 클릭해서 던지세요';
  document.getElementById('throw-count').textContent='0 / 6';
  drawCoin(1,true,0.3);
  transitionTo('s-mode','s-coin');
}

/* ── 동전 던지기 ── */
function throwCoin(){
  if(isAnimating||throwCount>=6) return;
  isAnimating=true;
  document.getElementById('throw-hint').textContent='';
  getCoinSound();
  const r=Math.random()<0.5?'양':'음';
  animateCoin(r,()=>{
    playLandingSound();
    results.push(r);
    throwCount++;
    document.getElementById('throw-count').textContent=`${throwCount} / 6`;
    const stack=document.getElementById('yao-stack');
    renderYao(stack,r,throwCount-1,true);
    isAnimating=false;
    if(throwCount<6){
      document.getElementById('throw-hint').textContent=`${6-throwCount}번 더 던지세요`;
    } else {
      document.getElementById('throw-hint').textContent='✦ 괘가 완성되었습니다 ✦';
      document.getElementById('coin-area').style.pointerEvents='none';
      setTimeout(showGuaScreen,900);
    }
  });
}

/* ── 괘 화면 ── */
function showGuaScreen(){
  const gua=findHexagram(results);
  document.getElementById('gua-num-label').textContent=`제 ${gua.n}괘`;
  document.getElementById('gua-name-label').textContent=gua.name;
  // 괘 심볼
  const sym=document.getElementById('gua-symbol-big');
  sym.innerHTML='';
  for(let i=0;i<6;i++){
    if(results[i]==='양'){
      const bar=document.createElement('div'); bar.className='gua-yang-big'; sym.appendChild(bar);
    } else {
      const wrap=document.createElement('div'); wrap.className='gua-yin-big';
      const h1=document.createElement('div'); h1.className='gua-yin-half-big';
      const h2=document.createElement('div'); h2.className='gua-yin-half-big';
      wrap.appendChild(h1); wrap.appendChild(h2); sym.appendChild(wrap);
    }
  }
  // 드라마틱 전환: 파티클 폭발
  const cx=window.innerWidth/2, cy=window.innerHeight/2;
  for(let i=0;i<5;i++) setTimeout(()=>spawnParticles(cx+(Math.random()-0.5)*200,cy+(Math.random()-0.5)*200,'#c8a86e',15),i*80);
  transitionTo('s-coin','s-gua');
}

/* ── 해석 화면 ── */
function showResult(){
  const gua=findHexagram(results);
  // 심볼
  const sym=document.getElementById('result-symbol');
  sym.innerHTML='';
  for(let i=0;i<6;i++){
    if(results[i]==='양'){
      const bar=document.createElement('div'); bar.className='result-yang'; sym.appendChild(bar);
    } else {
      const wrap=document.createElement('div'); wrap.className='result-yin';
      const h1=document.createElement('div'); h1.className='result-yin-half';
      const h2=document.createElement('div'); h2.className='result-yin-half';
      wrap.appendChild(h1); wrap.appendChild(h2); sym.appendChild(wrap);
    }
  }
  document.getElementById('result-name').textContent=gua.name;
  document.getElementById('result-num').textContent=`제 ${gua.n}괘`;
  document.getElementById('result-oneline').textContent=gua.oneline;

  const stocksEl=document.getElementById('result-stocks');
  stocksEl.innerHTML='';

  if(currentMode==='stock'){
    document.getElementById('result-label').textContent='국내 주식 추천';
    document.getElementById('result-oneline').style.display='none';
    document.getElementById('result-main').textContent=gua.oneline;
    const tag=document.createElement('span'); tag.className='result-stock-tag'; tag.textContent=gua.stock;
    stocksEl.appendChild(tag);
  } else {
    document.getElementById('result-label').textContent='현재 상황 · 조언';
    document.getElementById('result-oneline').style.display='none';
    document.getElementById('result-main').textContent=`${gua.situation}\n\n→ ${gua.advice}`;
    stocksEl.style.display='none';
  }

  const cx=window.innerWidth/2, cy=window.innerHeight/2;
  for(let i=0;i<8;i++) setTimeout(()=>spawnParticles(cx+(Math.random()-0.5)*300,cy+(Math.random()-0.5)*300,'#f0d090',12),i*60);
  transitionTo('s-gua','s-result');
}

/* ── 다시 뽑기 ── */
function restart(){
  throwCount=0; results=[]; isAnimating=false;
  document.getElementById('yao-stack').innerHTML='';
  document.getElementById('throw-hint').textContent='동전을 클릭해서 던지세요';
  document.getElementById('throw-count').textContent='0 / 6';
  document.getElementById('coin-area').style.pointerEvents='all';
  // display 초기화
  document.getElementById('result-stocks').removeAttribute('style');
  document.getElementById('result-oneline').removeAttribute('style');
  drawCoin(1,true,0.3);
  transitionTo('s-result','s-mode');
}

/* ── 초기 동전 그리기 ── */
drawCoin(1,true,0.3);
</script>
