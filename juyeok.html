<html lang="ko">
<head>

<style>
:root{
  --ink:#1a1410;
  --paper:#f0e6d2;
  --paper2:#e6d8bd;
  --gold:#a8842c;
  --red:#9c2b2b;
  --line:#3a2f24;
  --dim:#6b5d49;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Gowun Batang',serif;
  background:
    radial-gradient(circle at 20% 10%, rgba(168,132,44,.10), transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(156,43,43,.08), transparent 45%),
    #14100b;
  color:var(--paper);
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:24px 16px 60px;
}
.wrap{width:100%;max-width:560px}

/* 헤더 */
header{text-align:center;margin-bottom:28px;position:relative}
header .sub{
  font-family:'Gowun Dodum',sans-serif;
  color:var(--gold);
  letter-spacing:.5em;
  font-size:11px;
  margin-bottom:10px;
}
header h1{
  font-family:'Black Han Sans',sans-serif;
  font-size:46px;
  letter-spacing:.08em;
  background:linear-gradient(180deg,#f0e6d2,#c9a84f);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  line-height:1;
}
header .deco{
  width:60px;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  margin:14px auto 0;
}

/* 단계 안내 */
.stage{
  text-align:center;
  font-family:'Gowun Dodum',sans-serif;
  font-size:13px;
  color:var(--dim);
  margin-bottom:18px;
  min-height:18px;
}

/* 효 쌓이는 영역 (아래에서 위로) */
.lines-box{
  background:linear-gradient(180deg,rgba(240,230,210,.04),rgba(240,230,210,.01));
  border:1px solid rgba(168,132,44,.25);
  border-radius:14px;
  padding:22px 20px;
  margin-bottom:22px;
  min-height:260px;
  display:flex;
  flex-direction:column-reverse;
  justify-content:flex-start;
  gap:14px;
}
.line-row{
  display:flex;align-items:center;gap:14px;
  opacity:0;transform:translateY(12px);
  animation:rise .5s ease forwards;
}
@keyframes rise{to{opacity:1;transform:none}}
.line-no{
  font-family:'Gowun Dodum',sans-serif;
  font-size:11px;color:var(--dim);width:34px;flex-shrink:0;
}
.yao{display:flex;gap:10px;flex:1;height:16px}
.yao .seg{flex:1;background:var(--paper);border-radius:2px}
.yao.yin{gap:18px}
.yao.yin .seg{flex:1}
.yao.solid .seg{flex:1}
.moving{
  font-family:'Gowun Dodum',sans-serif;
  font-size:11px;width:38px;flex-shrink:0;text-align:right;
}
.moving .dot{color:var(--red);font-weight:700}
.moving .o{color:var(--gold);font-weight:700}

/* 동전 */
.coins{
  display:flex;justify-content:center;gap:18px;margin-bottom:22px;height:72px;align-items:center;
}
.coin{
  width:62px;height:62px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#d8b860,#9c7a22 70%,#6b5212);
  border:2px solid #4a3a14;
  display:flex;align-items:center;justify-content:center;
  font-family:'Black Han Sans',sans-serif;
  font-size:20px;color:#2a2008;
  box-shadow:0 6px 14px rgba(0,0,0,.45),inset 0 2px 4px rgba(255,255,255,.3);
}
.coin.flip{animation:flip .6s ease}
@keyframes flip{
  0%{transform:rotateY(0)}
  50%{transform:rotateY(900deg) scale(1.1)}
  100%{transform:rotateY(1800deg)}
}

/* 버튼 */
.btns{display:flex;flex-direction:column;gap:12px;align-items:center}
button{
  font-family:'Black Han Sans',sans-serif;
  cursor:pointer;border:none;letter-spacing:.05em;
  transition:transform .15s,box-shadow .15s,opacity .2s;
}
button:active{transform:scale(.97)}
.btn-throw{
  width:100%;max-width:340px;padding:18px;
  font-size:20px;border-radius:12px;
  background:linear-gradient(180deg,#b23535,#7c2020);
  color:var(--paper);
  box-shadow:0 6px 0 #5a1616,0 8px 16px rgba(0,0,0,.4);
}
.btn-throw:active{box-shadow:0 2px 0 #5a1616;transform:translateY(4px)}
.btn-throw:disabled{opacity:.35;box-shadow:none;cursor:default}
.btn-reset{
  background:none;color:var(--dim);
  font-family:'Gowun Dodum',sans-serif;
  font-size:12px;text-decoration:underline;padding:6px;
}

/* 결과 */
.result{margin-top:32px;display:none}
.result.show{display:block;animation:rise .6s ease}
.hexa-pair{display:flex;gap:14px;margin-bottom:24px}
.hexa-card{
  flex:1;text-align:center;
  background:linear-gradient(180deg,rgba(240,230,210,.06),rgba(240,230,210,.02));
  border:1px solid rgba(168,132,44,.3);
  border-radius:14px;padding:18px 12px;
}
.hexa-card .label{
  font-family:'Gowun Dodum',sans-serif;font-size:11px;
  color:var(--gold);letter-spacing:.3em;margin-bottom:10px;
}
.hexa-card .symbol{font-size:38px;line-height:1.1;color:var(--paper)}
.hexa-card .hname{
  font-family:'Gowun Batang',serif;font-weight:700;
  font-size:17px;margin-top:8px;
}
.hexa-card .hnum{
  font-family:'Gowun Dodum',sans-serif;font-size:11px;color:var(--dim);margin-top:2px;
}
.arrow{align-self:center;color:var(--gold);font-size:22px}

.section{
  border-top:1px solid rgba(168,132,44,.2);
  padding-top:18px;margin-top:18px;
}
.section h3{
  font-family:'Black Han Sans',sans-serif;
  font-size:16px;color:var(--gold);margin-bottom:10px;letter-spacing:.05em;
}
.section .body{
  font-family:'Gowun Batang',serif;font-size:15px;line-height:1.85;color:var(--paper);
}
.yao-item{margin-bottom:14px}
.yao-item .yt{
  font-family:'Gowun Dodum',sans-serif;font-size:12px;color:var(--red);
  font-weight:700;margin-bottom:3px;
}
.empty-note{
  font-family:'Gowun Dodum',sans-serif;font-size:12px;color:var(--dim);
  font-style:italic;
}
footer{
  text-align:center;margin-top:40px;
  font-family:'Gowun Dodum',sans-serif;font-size:10px;color:var(--dim);letter-spacing:.1em;
}

<script>
/* ============================================================
   주역 데이터 (해석은 엑셀로 채울 예정 — 여기에 매핑됨)
   HEXAGRAMS[코드6자리] = {num, name, symbol, judgment, yao:[6개]}
   코드: 아래효(초효)부터 위효(상효)까지, 1=양(⚊) 0=음(⚋)
   ============================================================ */

// King Wen 순서 64괘 번호 매핑 (코드 → 괘번호/이름/괘상)
// 코드는 초효(맨아래)→상효(맨위) 순서 6비트
const HEX_TABLE = {

"100010":{num:3,name:"수뢰둔",sym:"䷂"},   "010001":{num:4,name:"산수몽",sym:"䷃"},

"010000":{num:7,name:"지수사",sym:"䷆"},   "000010":{num:8,name:"수지비",sym:"䷇"},
"111011":{num:9,name:"풍천소축",sym:"䷈"}, "110111":{num:10,name:"천택리",sym:"䷉"},
"111000":{num:11,name:"지천태",sym:"䷊"},  "000111":{num:12,name:"천지비",sym:"䷋"},
"101111":{num:13,name:"천화동인",sym:"䷌"},"111101":{num:14,name:"화천대유",sym:"䷍"},
"001000":{num:15,name:"지산겸",sym:"䷎"},  "000100":{num:16,name:"뇌지예",sym:"䷏"},
"100110":{num:17,name:"택뢰수",sym:"䷐"},  "011001":{num:18,name:"산풍고",sym:"䷑"},

"101011":{num:37,name:"풍화가인",sym:"䷤"},"110101":{num:38,name:"화택규",sym:"䷥"},
"001010":{num:39,name:"수산건",sym:"䷦"},  "010100":{num:40,name:"뇌수해",sym:"䷧"},
"110001":{num:41,name:"산택손",sym:"䷨"},  "100011":{num:42,name:"풍뢰익",sym:"䷩"},

"100100":{num:51,name:"중뢰진",sym:"䷲"},  "001001":{num:52,name:"중산간",sym:"䷳"},
"001011":{num:53,name:"풍산점",sym:"䷴"},  "110100":{num:54,name:"뇌택귀매",sym:"䷵"},
"101100":{num:55,name:"뇌화풍",sym:"䷶"},  "001101":{num:56,name:"화산려",sym:"䷷"},
"011011":{num:57,name:"중풍손",sym:"䷸"},  "110110":{num:58,name:"중택태",sym:"䷹"},
"010011":{num:59,name:"풍수환",sym:"䷺"},  "110010":{num:60,name:"수택절",sym:"䷻"},
"110011":{num:61,name:"풍택중부",sym:"䷼"},"001100":{num:62,name:"뇌산소과",sym:"䷽"},
"101010":{num:63,name:"수화기제",sym:"䷾"},"010101":{num:64,name:"화수미제",sym:"䷿"}
};

/* ============================================================
   해석 데이터 — 구글시트 게시 CSV에서 물어옴
   ↓↓↓ 시트 게시 후 이 URL만 본인 것으로 교체하면 됨 ↓↓↓
   (구글시트 → 파일 → 공유 → 웹에 게시 → "쉼표로 구분된 값(.csv)" → URL 복사)
   시트 컬럼 순서:  번호 | 구분 | 위치 | 내용
   구분값: 괘사 / 효사 / 용효   (효사일 때만 위치 1~6 채움)
   ============================================================ */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSM2mSujP0zgntmkw0ZYzTX_yqX6jJM7ECDO5FJbCHYBCT4dn6IeS7f86iC-6xJALBHt0p40iYoL_9U/pub?output=csv";

/* 괘번호(1~64) → {judgment, yao[6], yong} */
let INTERP = {};
let dataLoaded = false;

/* 간단한 CSV 파서 (따옴표·줄바꿈·쉼표 포함 셀 처리) */
function parseCSV(text){
  const rows=[]; let row=[]; let cur=''; let q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i], nx=text[i+1];
    if(q){
      if(ch==='"'&&nx==='"'){cur+='"';i++;}
      else if(ch==='"'){q=false;}
      else cur+=ch;
    }else{
      if(ch==='"')q=true;
      else if(ch===','){row.push(cur);cur='';}
      else if(ch==='\r'){}
      else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
      else cur+=ch;
    }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}

function buildInterp(rows){
  const out={};
  // 첫 행이 헤더면 건너뜀(번호 컬럼이 숫자가 아니면 헤더로 간주)
  let start=0;
  if(rows.length && isNaN(parseInt(rows[0][0],10))) start=1;
  for(let i=start;i<rows.length;i++){
    const r=rows[i]; if(!r||r.length<2) continue;
    const num=parseInt((r[0]||'').trim(),10);
    if(isNaN(num)) continue;
    const kind=(r[1]||'').trim();
    const pos=parseInt((r[2]||'').trim(),10);
    const body=(r[3]||'').trim();
    if(!out[num]) out[num]={judgment:'',yao:['','','','','',''],yong:''};
    if(kind==='괘사') out[num].judgment=body;
    else if(kind==='효사'){ if(pos>=1&&pos<=6) out[num].yao[pos-1]=body; }
    else if(kind==='용효') out[num].yong=body;
  }
  return out;
}

function showLoadStatus(msg, ok){
  let bar=document.getElementById('loadStatus');
  if(!bar){
    bar=document.createElement('div');
    bar.id='loadStatus';
    bar.style.cssText='font-family:Gowun Dodum,sans-serif;font-size:12px;text-align:center;padding:8px;margin-bottom:14px;border-radius:8px;';
    const w=document.querySelector('.wrap');
    w.insertBefore(bar, w.children[1]);
  }
  bar.textContent=msg;
  bar.style.background = ok ? 'rgba(80,140,80,.18)' : 'rgba(160,60,60,.20)';
  bar.style.color = ok ? '#9ec99e' : '#e0a0a0';
}

async function loadInterp(){
  if(!SHEET_CSV_URL || SHEET_CSV_URL.startsWith('여기에')){
    showLoadStatus('시트 URL 미설정', false);
    return;
  }
  showLoadStatus('해석 데이터 불러오는 중…', true);
  try{
    const res=await fetch(SHEET_CSV_URL);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text=await res.text();
    INTERP=buildInterp(parseCSV(text));
    dataLoaded=true;
    const cnt=Object.keys(INTERP).length;
    if(cnt===0){
      showLoadStatus('CSV는 받았으나 내용이 비었음 — 게시 범위/컬럼 확인 필요', false);
    }else{
      showLoadStatus('해석 데이터 로드 완료 ('+cnt+'괘)', true);
      setTimeout(()=>{const b=document.getElementById('loadStatus');if(b)b.style.display='none';},2500);
    }
    if(throws.length>=6) computeResult();
  }catch(e){
    let hint = location.protocol==='file:'
      ? '파일을 직접 더블클릭(file://)하면 외부 데이터를 못 불러옵니다. 웹 호스팅(GitHub Pages 등)에 올려서 여세요.'
      : '시트 게시 상태 또는 URL을 확인하세요.';
    showLoadStatus('로드 실패: '+e.message+' — '+hint, false);
  }
}
loadInterp();

/* ============================================================
   동전점 로직
   동전 3개: 앞면(3) + 뒷면(2) 합산
   합 6 = 노음(동효, 음→양),  합 9 = 노양(동효, 양→음)
   합 7 = 소양(안정 양),       합 8 = 소음(안정 음)
   ============================================================ */
let throws = [];          // 각 효 결과 {value, yin, moving}  초효부터
const throwBtn=document.getElementById('throwBtn');
const resetBtn=document.getElementById('resetBtn');
const linesBox=document.getElementById('linesBox');
const stage=document.getElementById('stage');
const coinsEl=document.getElementById('coins');
const resultEl=document.getElementById('result');

function flipCoins(){
  const c=coinsEl.children;
  for(let i=0;i<3;i++){c[i].classList.remove('flip');void c[i].offsetWidth;c[i].classList.add('flip');}
}

function tossOne(){
  // 동전 하나: 앞3 / 뒤2, 50:50
  let sum=0, faces=[];
  for(let i=0;i<3;i++){const h=Math.random()<0.5;faces.push(h?3:2);sum+=h?3:2;}
  // sum: 6,7,8,9
  const yin = (sum===6||sum===8);      // 음효 여부
  const moving = (sum===6||sum===9);   // 동효 여부
  return {sum,yin,moving,faces};
}

function renderLines(){
  linesBox.innerHTML='';
  throws.forEach((t,idx)=>{
    const row=document.createElement('div');
    row.className='line-row';
    row.style.animationDelay=(idx*0.02)+'s';
    const names=['초효','2효','3효','4효','5효','상효'];
    const yaoCls = t.yin?'yao yin':'yao solid';
    const segs = t.yin? '<div class="seg"></div><div class="seg"></div>' : '<div class="seg"></div>';
    let mark='';
    if(t.moving){ mark = t.yin? '<span class="dot">×→양</span>' : '<span class="o">○→음</span>'; }
    row.innerHTML=`<div class="line-no">${names[idx]}</div>
      <div class="${yaoCls}">${segs}</div>
      <div class="moving">${mark}</div>`;
    linesBox.appendChild(row);
  });
}

throwBtn.addEventListener('click',()=>{
  if(throws.length>=6) return;
  flipCoins();
  setTimeout(()=>{
    throws.push(tossOne());
    renderLines();
    const n=throws.length;
    if(n<6){
      throwBtn.textContent=`동전 던지기 (${n+1}/6)`;
      stage.textContent=`${n}효 완성 — 아래에서 위로 쌓입니다`;
    }else{
      throwBtn.disabled=true;
      throwBtn.textContent='괘 완성';
      stage.textContent='괘가 세워졌습니다';
      resetBtn.style.display='block';
      computeResult();
    }
  },560);
});

resetBtn.addEventListener('click',()=>{
  throws=[];
  linesBox.innerHTML='';
  throwBtn.disabled=false;
  throwBtn.textContent='동전 던지기 (1/6)';
  stage.textContent='동전 3개를 6번 던져 괘를 세웁니다';
  resetBtn.style.display='none';
  resultEl.className='result';
  resultEl.innerHTML='';
});

function codeFrom(arr){ // arr: throws → 본괘 코드 (초효→상효)
  return arr.map(t=>t.yin?'0':'1').join('');
}
function changedCode(arr){ // 동효 반영한 지괘 코드
  return arr.map(t=>{
    if(t.moving) return t.yin?'1':'0';  // 음동→양, 양동→음
    return t.yin?'0':'1';
  }).join('');
}

function movingPositions(){ // 1-indexed 효 위치 배열
  const p=[];
  throws.forEach((t,i)=>{if(t.moving)p.push(i+1);});
  return p;
}

const YAO_NAMES=['초효','2효','3효','4효','5효','상효'];

/* 동효 개수별 정통 점단 규칙 (주희 점법) */
function divinationRule(mp, benNum, biNum){
  const k=mp.length;
  if(k===0) return {text:`동효 없음 → <b>본괘 「괘사」</b>로 판단합니다.`, focus:{type:'ben-judgment'}};
  if(k===1) return {text:`동효 1개 → 본괘 <b>${YAO_NAMES[mp[0]-1]}</b>의 효사로 판단합니다.`, focus:{type:'ben-yao',yao:[mp[0]]}};
  if(k===2) return {text:`동효 2개 → 본괘 두 동효 중 <b>위쪽(${YAO_NAMES[mp[1]-1]})</b> 효사를 위주로 봅니다.`, focus:{type:'ben-yao',yao:[mp[1]],sub:[mp[0]]}};
  if(k===3) return {text:`동효 3개 → <b>본괘 괘사 + 지괘 괘사</b> 둘 다 보되 본괘를 위주로 합니다.`, focus:{type:'both-judgment'}};
  if(k===4){const still=[1,2,3,4,5,6].filter(x=>!mp.includes(x));return {text:`동효 4개 → 지괘에서 안 변한 두 효 중 <b>아래쪽(${YAO_NAMES[still[0]-1]})</b> 효사(지괘 기준)로 판단합니다.`, focus:{type:'bi-yao',yao:[still[0]],sub:[still[1]]}};}
  if(k===5){const still=[1,2,3,4,5,6].filter(x=>!mp.includes(x));return {text:`동효 5개 → 지괘에서 안 변한 <b>${YAO_NAMES[still[0]-1]}</b> 효사(지괘 기준)로 판단합니다.`, focus:{type:'bi-yao',yao:[still[0]]}};}
  // k===6
  if(benNum===1) return {text:`여섯 효 모두 동함(건괘) → <b>용구(用九)</b>로 판단합니다.`, focus:{type:'yong',which:'9'}};
  if(benNum===2) return {text:`여섯 효 모두 동함(곤괘) → <b>용육(用六)</b>으로 판단합니다.`, focus:{type:'yong',which:'6'}};
  return {text:`여섯 효 모두 동함 → <b>지괘 괘사</b>로 판단합니다.`, focus:{type:'bi-judgment'}};
}

function interpOf(num){ return INTERP[num]||{}; }
function emptyMsg(){ return dataLoaded ? '<span class="empty-note">해석 미입력 (시트에 추가하세요)</span>' : '<span class="empty-note">해석 불러오는 중… (시트 URL 미설정 시 비어있음)</span>'; }
function judgmentText(num){ const d=interpOf(num); return d.judgment || emptyMsg(); }
function yaoText(num,pos){ const d=interpOf(num); return (d.yao&&d.yao[pos-1]) || emptyMsg(); }

function computeResult(){
  const mp=movingPositions();
  const benCode=codeFrom(throws);
  const ben=HEX_TABLE[benCode];
  const hasMoving=mp.length>0;
  const biCode=changedCode(throws);
  const bi=hasMoving?HEX_TABLE[biCode]:null;
  const rule=divinationRule(mp, ben.num, bi?bi.num:null);

  let html='';
  // 본괘/지괘 카드
  html+='<div class="hexa-pair">';
  html+=`<div class="hexa-card"><div class="label">본괘 本卦</div><div class="symbol">${ben.sym}</div><div class="hname">${ben.name}</div><div class="hnum">제 ${ben.num} 괘</div></div>`;
  if(bi){
    html+='<div class="arrow">→</div>';
    html+=`<div class="hexa-card"><div class="label">지괘 之卦</div><div class="symbol">${bi.sym}</div><div class="hname">${bi.name}</div><div class="hnum">제 ${bi.num} 괘</div></div>`;
  }
  html+='</div>';

  // 점단 규칙 안내
  html+=`<div class="section"><h3>점단 방법</h3><div class="body">${rule.text}</div></div>`;

  // 본괘 괘사
  html+=`<div class="section"><h3>본괘 「${ben.name}」 괘사</h3><div class="body">${judgmentText(ben.num)}</div></div>`;

  // 동효 효사 (전부 표시)
  if(hasMoving){
    html+='<div class="section"><h3>동효(動爻) 효사</h3><div class="body">';
    if(mp.length===6 && (ben.num===1||ben.num===2)){
      const d=interpOf(ben.num);
      const yt=ben.num===1?'용구 用九':'용육 用六';
      const txt=(d.yong)||emptyMsg();
      html+=`<div class="yao-item"><div class="yt">${yt}</div>${txt}</div>`;
    }else{
      mp.forEach(p=>{
        html+=`<div class="yao-item"><div class="yt">${YAO_NAMES[p-1]} 動</div>${yaoText(ben.num,p)}</div>`;
      });
    }
    html+='</div></div>';
  }

  // 지괘 괘사
  if(bi){
    html+=`<div class="section"><h3>지괘 「${bi.name}」 괘사</h3><div class="body">${judgmentText(bi.num)}</div></div>`;
  }

  resultEl.innerHTML=html;
  resultEl.className='result show';
  resultEl.scrollIntoView({behavior:'smooth',block:'start'});
}
</script>
</body>
</html>
