<script>
/* ── 은하수 배경 ── */
(function(){
  const c = document.getElementById('galaxy-canvas');
  let W, H, stars = [], nebulae = [];

  function resize(){
    W = c.width = window.innerWidth;
    H = c.height = window.innerHeight;
    init();
  }

  function init(){
    // 별 생성
    stars = [];
    for(let i = 0; i < 600; i++){
      stars.push({
        x: Math.random()*W, y: Math.random()*H,
        r: Math.random()*1.4 + 0.2,
        a: Math.random()*0.85 + 0.1,
        twinkle: Math.random()*Math.PI*2,
        speed: Math.random()*0.02 + 0.005
      });
    }
    // 은하수 성운 레이어
    nebulae = [];
    for(let i = 0; i < 5; i++){
      nebulae.push({
        x: Math.random()*W, y: Math.random()*H,
        rx: 80 + Math.random()*160, ry: 40 + Math.random()*80,
        rot: Math.random()*Math.PI,
        hue: [220,260,200,180,240][i],
        a: 0.03 + Math.random()*0.05
      });
    }
  }

  function draw(){
    const ctx = c.getContext('2d');
    ctx.clearRect(0,0,W,H);

    // 깊은 우주 배경 그라디언트
    const bg = ctx.createRadialGradient(W*0.5, H*0.4, 0, W*0.5, H*0.5, Math.max(W,H)*0.8);
    bg.addColorStop(0, 'rgba(8,4,28,1)');
    bg.addColorStop(0.4, 'rgba(4,6,18,1)');
    bg.addColorStop(1, 'rgba(1,2,8,1)');
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,W,H);

    // 은하수 띠 (대각선 glow)
    ctx.save();
    ctx.translate(W*0.5, H*0.5);
    ctx.rotate(-0.35);
    const mw = ctx.createLinearGradient(-W, 0, W, 0);
    mw.addColorStop(0,   'rgba(30,20,80,0)');
    mw.addColorStop(0.3, 'rgba(50,30,120,0.07)');
    mw.addColorStop(0.45,'rgba(80,60,180,0.13)');
    mw.addColorStop(0.5, 'rgba(100,80,200,0.18)');
    mw.addColorStop(0.55,'rgba(80,60,180,0.13)');
    mw.addColorStop(0.7, 'rgba(50,30,120,0.07)');
    mw.addColorStop(1,   'rgba(30,20,80,0)');
    ctx.fillStyle = mw;
    ctx.fillRect(-W, -H*0.8, W*2, H*1.6);
    ctx.restore();

    // 성운 blob
    nebulae.forEach(n => {
      ctx.save();
      ctx.translate(n.x, n.y);
      ctx.rotate(n.rot);
      const g = ctx.createRadialGradient(0,0,0, 0,0,n.rx);
      g.addColorStop(0, `hsla(${n.hue},70%,60%,${n.a})`);
      g.addColorStop(0.5, `hsla(${n.hue+20},60%,50%,${n.a*0.4})`);
      g.addColorStop(1, 'transparent');
      ctx.scale(1, n.ry/n.rx);
      ctx.beginPath(); ctx.arc(0,0,n.rx,0,Math.PI*2);
      ctx.fillStyle = g; ctx.fill();
      ctx.restore();
    });

    // 별
    const t = Date.now()*0.001;
    stars.forEach(s => {
      const alpha = s.a * (0.6 + 0.4*Math.sin(s.twinkle + t*s.speed*10));
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      // 밝은 별은 색깔 살짝
      const hue = s.r > 1.0 ? (s.x % 3 === 0 ? 200 : s.y % 3 === 0 ? 280 : 60) : 0;
      ctx.fillStyle = hue ? `hsla(${hue},60%,90%,${alpha})` : `rgba(255,255,255,${alpha})`;
      ctx.fill();
    });

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();
  draw();
})();

function getImgPath(n){
  if(n<=21) return `Cards-jpg/${MAJOR_FILES[n]}.jpg`;

/* ── 휠: 1~78 숫자 칸 ── */
// 78칸 숫자를 셔플해서 배치
const WHEEL_NUMS = (()=>{
  const arr = Array.from({length:78},(_,i)=>i+1);
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
})();
const N_SEGS = 78;
const dA = Math.PI * 2 / N_SEGS;

// 칸 색: 숫자별로 미묘하게 다른 색 레이어
function segColor(idx){
  const hues=[220,250,200,270,180,240];
  const h=hues[idx%hues.length];
  const l=8+Math.sin(idx*0.7)*3;
  return {
    bg:`hsl(${h},30%,${l}%)`,
    mid:`hsl(${h},40%,${l+5}%)`,
    line:`hsla(${h},60%,70%,0.35)`,
    num:`hsla(${h},80%,88%,0.95)`
  };
}

const wCvs=document.getElementById('wheel-canvas'), wCtx=wCvs.getContext('2d');
let CX=0, CY=0, WR=0, IR=0, rot=0, vel=0, spinning=false, stopF=0, showLbl=true;

function setupWheel(){
  const outer=document.getElementById('wheel-outer');
  const W=Math.min(outer.clientWidth||340, 460);
  const H=Math.round(W*0.58);
  wCvs.width=W; wCvs.height=H;
  CX=W/2; CY=H;
  WR=Math.min(W*0.47, H*0.97);
  IR=WR*0.30;

  // 버튼: wheel-wrap 기준 CX, CY 위치
  // 캔버스가 flex center이므로 캔버스 offsetLeft 더해야 함
  const btn=document.getElementById('spin-btn');
  const canvasLeft = wCvs.offsetLeft;
  btn.style.left = (canvasLeft + CX) + 'px';
  btn.style.top  = CY + 'px';
  drawWheel();
}

function drawWheel(){
  if(!WR||WR<=0) return;
  const SR=WR*0.95;
  wCtx.clearRect(0,0,wCvs.width,wCvs.height);
  wCtx.save(); wCtx.translate(CX,CY); wCtx.rotate(rot);

  for(let i=0;i<N_SEGS;i++){
    const a0=i*dA-Math.PI/2, a1=a0+dA, am=a0+dA/2;
    const zc=segColor(i);

    // 칸 채우기
    const g=wCtx.createRadialGradient(0,0,IR,0,0,SR);
    g.addColorStop(0, zc.mid);
    g.addColorStop(0.7, zc.bg);
    g.addColorStop(1, 'rgba(1,2,6,0.95)');
    wCtx.beginPath(); wCtx.arc(0,0,SR,a0,a1); wCtx.arc(0,0,IR,a1,a0,true); wCtx.closePath();
    wCtx.fillStyle=g; wCtx.fill();

    // 분할선
    wCtx.beginPath();
    wCtx.moveTo(Math.cos(a0)*IR, Math.sin(a0)*IR);
    wCtx.lineTo(Math.cos(a0)*SR, Math.sin(a0)*SR);
    wCtx.strokeStyle='rgba(255,255,255,0.08)'; wCtx.lineWidth=0.5; wCtx.stroke();

    // 숫자
    if(showLbl){
      const numR=(IR+SR)*0.55;
      wCtx.save();
      wCtx.rotate(am);
      wCtx.translate(numR,0);
      wCtx.rotate(Math.PI/2);
      wCtx.textAlign='center'; wCtx.textBaseline='middle';
      const fs=Math.max(WR*0.028, 7);
      wCtx.font=`bold ${fs}px 'Nanum Gothic',sans-serif`;
      wCtx.fillStyle=zc.num;
      wCtx.shadowColor=zc.num; wCtx.shadowBlur=4;
      wCtx.fillText(String(WHEEL_NUMS[i]), 0, 0);
      wCtx.restore();
    }
  }

  // 내부 허브
  const hg=wCtx.createRadialGradient(-IR*.1,-IR*.1,0,0,0,IR);
  hg.addColorStop(0,'#1c1c2e'); hg.addColorStop(0.5,'#0e0e1a'); hg.addColorStop(1,'#050508');
  wCtx.beginPath(); wCtx.arc(0,0,IR,0,Math.PI*2);
  wCtx.fillStyle=hg; wCtx.fill();
  wCtx.strokeStyle='rgba(240,192,64,0.8)'; wCtx.lineWidth=WR*0.012; wCtx.stroke();
  // 허브 장식
  for(let r=0;r<12;r++){
    const a=r/12*Math.PI*2;
    wCtx.beginPath(); wCtx.moveTo(Math.cos(a)*IR*.2,Math.sin(a)*IR*.2); wCtx.lineTo(Math.cos(a)*IR*.8,Math.sin(a)*IR*.8);
    wCtx.strokeStyle=`rgba(240,192,64,${r%2?0.08:0.2})`; wCtx.lineWidth=0.8; wCtx.stroke();
  }

  wCtx.restore();

  // 외곽 림
  wCtx.save(); wCtx.translate(CX,CY);
  const rw=WR*0.04;
  wCtx.beginPath(); wCtx.arc(0,0,WR*0.96,0,Math.PI*2);
  wCtx.strokeStyle='rgba(240,192,64,0.7)'; wCtx.lineWidth=rw*0.3; wCtx.stroke();
  wCtx.beginPath(); wCtx.arc(0,0,WR+rw*.2,0,Math.PI*2);
  wCtx.strokeStyle='rgba(240,192,64,0.4)'; wCtx.lineWidth=rw*0.15; wCtx.stroke();

  // 포인터 ▲
  wCtx.beginPath(); wCtx.moveTo(-9,-WR*.95); wCtx.lineTo(9,-WR*.95); wCtx.lineTo(0,-WR*1.11); wCtx.closePath();
  wCtx.fillStyle='#f0c040'; wCtx.shadowColor='rgba(240,192,64,0.9)'; wCtx.shadowBlur=12; wCtx.fill();
  wCtx.restore();
}

function loop(){
  if(WR>0){
    if(spinning){ rot+=vel; }
    else if(stopF>0){ vel*=0.87; rot+=vel; stopF--; if(stopF===0){showLbl=true; processWin();} }
    drawWheel();
  }
  requestAnimationFrame(loop);
}

let currentMode='life';

function processWin(){
  const adj=((-rot%(Math.PI*2))+200*Math.PI)%(Math.PI*2);
  const idx=Math.floor(adj/dA)%N_SEGS;
  const num=WHEEL_NUMS[idx]; // 1~78
  const btn=document.getElementById('spin-btn');
  btn.disabled=false; btn.textContent='SPIN'; btn.classList.remove('spinning');
  document.getElementById('wheel-toast').textContent=`✦ No.${num} ✦`;
  const card=TAROT[num-1]; // 1-based → 0-based index
  const rev=Math.random()<0.27;
  setTimeout(()=>showResult(card,rev),700);
}

function showResult(card,rev){
  const wrap=document.getElementById('result-card-wrap');
  wrap.innerHTML=''; wrap.className='result-card-wrap'+(rev?' reversed':'');
  const img=new Image();
  img.onload=function(){
    img.className='card-img';
    if(rev) img.style.transform='rotate(180deg)';
    wrap.appendChild(img);
    if(rev){const t=document.createElement('div');t.className='rev-tag';t.textContent='역방향';wrap.appendChild(t);}
  };
  img.onerror=function(){
    const syms=['♠','♥','♦','♣','⭐','☽','✦'];
    const ph=document.createElement('div'); ph.className='card-placeholder';
    ph.innerHTML=`<div class="placeholder-sym">${syms[card.n%7]}</div><div class="placeholder-nm">${card.en}<br>${card.ko}</div>`;
    if(rev){const t=document.createElement('div');t.className='rev-tag';t.textContent='역방향';ph.appendChild(t);}
    wrap.appendChild(ph);
  };
  img.src=getImgPath(card.n);
  document.getElementById('result-en').textContent=card.en+(rev?' (역방향)':'');
  document.getElementById('result-ko').textContent=card.ko;
  const lbl=document.getElementById('box-label'), cnt=document.getElementById('box-content');
  if(currentMode==='stock'){
    lbl.textContent='미국 주식 추천';
    cnt.innerHTML=`<div class="stock-row">${card.stock.map(s=>`<span class="stock-tag">${s}</span>`).join('')}</div><div class="stock-desc">${card.sd}</div>`;
  } else {
    lbl.textContent=currentMode==='life'?'인생 조언':'연애 조언';
    cnt.innerHTML=`<div class="box-text">${currentMode==='life'?card.life:card.love}</div>`;
  }
  showScreen('screen-result');
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('back-btn').className='back-btn'+(id!=='screen-mode'?' visible':'');
}
function selectMode(m){
  currentMode=m;
  const lb={stock:'📈 미국 주식 추천',life:'🔮 인생 조언',love:'🌙 연애 조언'};
  document.getElementById('mode-badge').textContent=lb[m];
  resetWheel(); showScreen('screen-wheel');
  requestAnimationFrame(()=>requestAnimationFrame(setupWheel));
}
function resetWheel(){
  rot=0; vel=0; spinning=false; stopF=0; showLbl=true;
  const b=document.getElementById('spin-btn');
  b.disabled=false; b.textContent='SPIN'; b.classList.remove('spinning');
  document.getElementById('wheel-toast').textContent='';
}
function goToWheel(){ resetWheel(); showScreen('screen-wheel'); requestAnimationFrame(()=>requestAnimationFrame(setupWheel)); }
function goBack(){ const a=document.querySelector('.screen.active'); if(a.id==='screen-wheel') showScreen('screen-mode'); else if(a.id==='screen-result') goToWheel(); }

document.getElementById('spin-btn').addEventListener('click',function(){
  if(stopF>0) return;
  if(!spinning){
    spinning=true; showLbl=false; vel=0.6+Math.random()*0.5;
    this.textContent='STOP'; this.classList.add('spinning');
    document.getElementById('wheel-toast').textContent='';
    if(navigator.vibrate) navigator.vibrate(80);
  } else {
    spinning=false; stopF=32; this.disabled=true; this.textContent='···';
    if(navigator.vibrate) navigator.vibrate(40);
  }
});
window.addEventListener('resize',()=>{ if(document.getElementById('screen-wheel').classList.contains('active')) setupWheel(); });
loop();
</script>
</body>
